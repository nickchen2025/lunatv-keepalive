# 长时间 job：内部每 5 分钟 ping Render（防休眠）+ 检查片源（丢了自动写回）
# 公开仓库 Actions 分钟数免费；单 job 上限 6 小时，这里跑 5h50m，下一轮 6h 后接上，空窗 <15 分钟。
name: lunatv-keepalive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lunatv-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Keep the repo active (GitHub pauses schedules after 60 quiet days)
        run: |
          set -e
          LAST=$(cat .keepalive 2>/dev/null || echo 0)
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac   # legacy file held a date string
          NOW=$(date +%s)
          if [ $((NOW - LAST)) -gt 2160000 ]; then   # 25 days
            date +%s > .keepalive
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive $(date -u +%F)" || true
            git push || true
          fi

      - name: Ping Render + heal sources (every 5 min)
        env:
          BASE: https://lunatv-db80.onrender.com
          LUNA_USER: ${{ secrets.LUNA_USER }}
          LUNA_PASS: ${{ secrets.LUNA_PASS }}
          LUNA_CONFIG: ${{ secrets.LUNA_CONFIG }}
        run: python3 scripts/heal.py
